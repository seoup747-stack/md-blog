<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>md-blog</title>
<link rel="alternate" type="application/rss+xml" title="md-blog" href="feed.xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="site-title">md-blog</a>
  </header>

  <main>
    <div class="toolbar">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="제목, 태그, 본문 검색..."
        aria-label="글 검색"
      >
      <div id="tag-filter" class="tag-filter" aria-label="태그 필터"></div>
    </div>

    <div id="post-list" class="post-list" aria-live="polite">
      <p class="empty-state">글을 불러오는 중...</p>
    </div>

    <section class="apps-section">
      <h2 class="section-title">미니 웹앱</h2>
      <div class="app-grid">
        <a class="app-card" href="apps/2048/index.html">
          <div class="app-preview">
            <iframe src="apps/2048/index.html" title="2048 미리보기" tabindex="-1" aria-hidden="true"></iframe>
          </div>
          <div class="app-card-body">
            <h3>2048</h3>
            <p>방향키로 숫자 타일을 밀어서 합치는 퍼즐 게임. 점수판 포함.</p>
          </div>
        </a>
        <a class="app-card" href="apps/pixel-editor/index.html">
          <div class="app-preview">
            <iframe src="apps/pixel-editor/index.html" title="픽셀 아트 에디터 미리보기" tabindex="-1" aria-hidden="true"></iframe>
          </div>
          <div class="app-card-body">
            <h3>픽셀 아트 에디터</h3>
            <p>16x16 격자에 도트를 찍어 그림을 그리고 PNG로 저장하는 에디터.</p>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>md-blog &middot; 마크다운으로 쓰고 정적으로 배포합니다 &middot; <a href="feed.xml">RSS</a></footer>

  <script src="js/main.js"></script>
</body>
</html>
