<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>md-blog</title>
<link rel="alternate" type="application/rss+xml" title="md-blog" href="feed.xml">
<script>
  (function () {
    var t = localStorage.getItem("md-blog-theme");
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
    }
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="site-title">md-blog</a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="테마 전환">🌙</button>
  </header>

  <main>
    <a href="index.html" class="back-link">← 목록으로</a>
    <article id="post-article">
      <p class="empty-state">글을 불러오는 중...</p>
    </article>
  </main>

  <footer>md-blog &middot; 마크다운으로 쓰고 정적으로 배포합니다 &middot; <a href="feed.xml">RSS</a></footer>

  <script src="js/theme.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/post.js"></script>
</body>
</html>
